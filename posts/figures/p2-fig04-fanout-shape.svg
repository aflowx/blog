<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000" viewBox="0 0 1000 1000" role="img" aria-label="扇出省多少，看活的形状"><rect width="1000" height="1000" fill="#F6F4ED"/><line x1="52" y1="65" x2="948" y2="65" stroke="#087F61" stroke-width="2"/><text x="52" y="45" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="17" font-weight="600" text-anchor="start" letter-spacing="3">QUIRE  /  BUILD LOG</text><text x="948" y="45" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="18" font-weight="500" text-anchor="end" letter-spacing="0">FIG. 04</text><text x="50" y="139" fill="#153E35" font-family="&quot;Songti SC&quot;,&quot;Noto Serif CJK SC&quot;,serif" font-size="48" font-weight="700" text-anchor="start" letter-spacing="0">扇出省多少，看活的形状</text><text x="52" y="187" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0">材料越长、问题越短，那一次预填充摊得越薄。</text><text x="320" y="288" fill="#087F61" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="21" font-weight="600" text-anchor="start" letter-spacing="0">材料（只算一次）</text><text x="640" y="288" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="21" font-weight="400" text-anchor="start" letter-spacing="0">问题（各算一次）</text><text x="52" y="370" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="26" font-weight="600" text-anchor="start" letter-spacing="0">SemIf 长文档网格</text><text x="52" y="404" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="400" text-anchor="start" letter-spacing="0">8,100 字符 × 21 条短判据</text><rect x="320" y="340" width="350" height="48" rx="6" fill="#087F61"/><rect x="678" y="340" width="15" height="48" rx="6" fill="#CBD8CC"/><rect x="700" y="340" width="15" height="48" rx="6" fill="#CBD8CC"/><rect x="722" y="340" width="15" height="48" rx="6" fill="#CBD8CC"/><rect x="744" y="340" width="15" height="48" rx="6" fill="#CBD8CC"/><text x="772" y="373" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0">…</text><text x="948" y="378" fill="#087F61" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="40" font-weight="700" text-anchor="end" letter-spacing="0">11.8×</text><text x="52" y="502" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="26" font-weight="600" text-anchor="start" letter-spacing="0">TypeSafe 公开行</text><text x="52" y="536" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="400" text-anchor="start" letter-spacing="0">34 份文档 · 102 个问题</text><rect x="320" y="472" width="220" height="48" rx="6" fill="#087F61"/><rect x="548" y="472" width="40" height="48" rx="6" fill="#CBD8CC"/><rect x="595" y="472" width="40" height="48" rx="6" fill="#CBD8CC"/><rect x="642" y="472" width="40" height="48" rx="6" fill="#CBD8CC"/><text x="695" y="505" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0">…</text><text x="948" y="510" fill="#087F61" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="40" font-weight="700" text-anchor="end" letter-spacing="0">3.6×</text><text x="52" y="634" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="26" font-weight="600" text-anchor="start" letter-spacing="0">日志裁剪</text><text x="52" y="668" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="400" text-anchor="start" letter-spacing="0">每个问题都要引用一段原文</text><rect x="320" y="604" width="140" height="48" rx="6" fill="#087F61"/><rect x="468" y="604" width="115" height="48" rx="6" fill="#CBD8CC"/><rect x="590" y="604" width="115" height="48" rx="6" fill="#CBD8CC"/><text x="718" y="637" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0">…</text><text x="948" y="642" fill="#087F61" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="40" font-weight="700" text-anchor="end" letter-spacing="0">2.6×</text><rect x="52" y="760" width="896" height="118" rx="12" fill="#F1ECE3" stroke="#DFD5C6" stroke-width="2"/><text x="82" y="806" fill="#A9998A" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="36" font-weight="600" text-anchor="start" letter-spacing="0">15.1×</text><line x1="78" y1="795" x2="196" y2="795" stroke="#A9998A" stroke-width="3"/><text x="220" y="800" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="24" font-weight="600" text-anchor="start" letter-spacing="0">我们最早报过这个数，已撤回。</text><text x="220" y="840" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0">0.8B 模型 + 等长问题，外加一次藏起来的重复预填充。</text><line x1="52" y1="900" x2="948" y2="900" stroke="#D9DFD5" stroke-width="1"/><text x="52" y="939" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="22" font-weight="500" text-anchor="start" letter-spacing="0">同一套代码，换一种活，收益从 11.8× 掉到 2.6×。</text><text x="52" y="973" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="400" text-anchor="start" letter-spacing="0">来源：jev-research/VALIDATION.md（含「已撤回的说法」一节）</text><text x="948" y="973" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="16" font-weight="400" text-anchor="end" letter-spacing="0">04 / 07</text></svg>