<svg xmlns="http://www.w3.org/2000/svg" width="720" height="900" viewBox="0 0 720 900" role="img" aria-label="先换相似度，才能这样重排计算"><rect width="720" height="900" fill="#F6F4ED"/><text x="28" y="41" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="15" font-weight="600" text-anchor="start" letter-spacing="2">RECURRENT STATE</text><text x="690" y="41" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="17" font-weight="500" text-anchor="end" letter-spacing="0">06 · 04</text><line x1="28" y1="57" x2="692" y2="57" stroke="#087F61" stroke-width="2"/><text x="28" y="111" fill="#153E35" font-family="&quot;Songti SC&quot;,&quot;Noto Serif CJK SC&quot;,serif" font-size="35" font-weight="700" text-anchor="start" letter-spacing="0">先换相似度，才能这样重排计算</text><text x="34" y="177" fill="#153E35" font-family="&quot;Songti SC&quot;,&quot;Noto Serif CJK SC&quot;,serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="0">标准 softmax Attention</text><rect x="34" y="217" width="156" height="52" rx="4" fill="#E7ECE2" stroke="#087F61" stroke-width="1.5"/><text x="112.0" y="252.45" fill="#087F61" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="27" font-weight="600" text-anchor="middle" letter-spacing="0">QKᵀ</text><rect x="259" y="217" width="156" height="52" rx="4" fill="#E7ECE2" stroke="#087F61" stroke-width="1.5"/><text x="337.0" y="252.45" fill="#087F61" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="27" font-weight="600" text-anchor="middle" letter-spacing="0">softmax</text><rect x="494" y="217" width="156" height="52" rx="4" fill="#E7ECE2" stroke="#087F61" stroke-width="1.5"/><text x="572.0" y="252.45" fill="#087F61" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="27" font-weight="600" text-anchor="middle" letter-spacing="0">乘 V</text><line x1="205" y1="243" x2="246" y2="243" stroke="#64736C" stroke-width="2"/><path d="M235.19463477176788 248.21958640933477 L246 243 L235.19463477176788 237.78041359066523" fill="none" stroke="#64736C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><line x1="430" y1="243" x2="482" y2="243" stroke="#64736C" stroke-width="2"/><path d="M471.1946347717679 248.21958640933477 L482 243 L471.1946347717679 237.78041359066523" fill="none" stroke="#64736C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="325" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="26" font-weight="600" text-anchor="middle" letter-spacing="0">非线性在中间，不能直接挪括号</text><line x1="28" y1="363" x2="692" y2="363" stroke="#D9DFD5" stroke-width="1"/><text x="34" y="418" fill="#153E35" font-family="&quot;Songti SC&quot;,&quot;Noto Serif CJK SC&quot;,serif" font-size="28" font-weight="700" text-anchor="start" letter-spacing="0">本章采用非负核相似度</text><rect x="105" y="462" width="138" height="51" rx="4" fill="#E7ECE2" stroke="#B76B48" stroke-width="1.5"/><text x="174.0" y="497.3" fill="#B76B48" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="28" font-weight="600" text-anchor="middle" letter-spacing="0">φ(q)</text><line x1="174" y1="531" x2="324" y2="574" stroke="#64736C" stroke-width="2"/><path d="M312.17465164889524 576.0398863632623 L324 574 L315.05134770575467 566.004900118404" fill="none" stroke="#64736C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="477" y="462" width="138" height="51" rx="4" fill="#E7ECE2" stroke="#087F61" stroke-width="1.5"/><text x="546.0" y="497.3" fill="#087F61" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="28" font-weight="600" text-anchor="middle" letter-spacing="0">φ(k)</text><line x1="546" y1="531" x2="396" y2="574" stroke="#64736C" stroke-width="2"/><path d="M404.94865229424533 566.004900118404 L396 574 L407.82534835110476 576.0398863632623" fill="none" stroke="#64736C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="360" y="620" fill="#153E35" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="32" font-weight="600" text-anchor="middle" letter-spacing="0">φ(q)ᵀφ(k)</text><text x="360" y="690" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="27" font-weight="600" text-anchor="middle" letter-spacing="0">非负相似度 → 沿历史归一化</text><text x="360" y="752" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="26" font-weight="600" text-anchor="middle" letter-spacing="0">此时才能先累计 K/V，再用 Q 读取</text><line x1="28" y1="812" x2="692" y2="812" stroke="#D9DFD5" stroke-width="1"/><text x="28" y="849" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="23" font-weight="500" text-anchor="start" letter-spacing="0">这是另一种核注意力；不是 softmax 的直接等价改写。</text><text x="28" y="879" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0">来源：Linear Transformer §3.2 / Eq.3–7。</text><text x="691" y="879" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="15" font-weight="500" text-anchor="end" letter-spacing="0">04 / 07</text></svg>