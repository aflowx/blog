<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1120" viewBox="0 0 1000 1120" role="img" aria-label="为什么批处理只值 1.32 倍"><rect width="1000" height="1120" fill="#F6F4ED"/><line x1="52" y1="65" x2="948" y2="65" stroke="#087F61" stroke-width="2"/><text x="52" y="45" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="17" font-weight="600" text-anchor="start" letter-spacing="3">QUIRE  /  BUILD LOG</text><text x="948" y="45" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="18" font-weight="500" text-anchor="end" letter-spacing="0">FIG. 03</text><text x="50" y="139" fill="#153E35" font-family="&quot;Songti SC&quot;,&quot;Noto Serif CJK SC&quot;,serif" font-size="48" font-weight="700" text-anchor="start" letter-spacing="0">为什么批处理只值 1.32 倍</text><text x="52" y="187" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="25" font-weight="400" text-anchor="start" letter-spacing="0">Qwen3.5 是混合注意力：四层里有三层带的是循环状态。</text><text x="52" y="252" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0">每 4 层重复一次</text><rect x="52" y="282" width="396" height="30" rx="5" fill="#DCE6DA"/><text x="64" y="304" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="400" text-anchor="start" letter-spacing="0">线性注意力 · 循环状态</text><rect x="52" y="320" width="396" height="30" rx="5" fill="#DCE6DA"/><text x="64" y="342" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="400" text-anchor="start" letter-spacing="0">线性注意力 · 循环状态</text><rect x="52" y="358" width="396" height="30" rx="5" fill="#DCE6DA"/><text x="64" y="380" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="400" text-anchor="start" letter-spacing="0">线性注意力 · 循环状态</text><rect x="52" y="396" width="396" height="30" rx="5" fill="#087F61"/><text x="64" y="418" fill="#FFFFFF" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="600" text-anchor="start" letter-spacing="0">全注意力 · KV cache</text><rect x="52" y="434" width="396" height="30" rx="5" fill="#DCE6DA"/><text x="64" y="456" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="400" text-anchor="start" letter-spacing="0">线性注意力 · 循环状态</text><rect x="52" y="472" width="396" height="30" rx="5" fill="#DCE6DA"/><text x="64" y="494" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="400" text-anchor="start" letter-spacing="0">线性注意力 · 循环状态</text><rect x="52" y="510" width="396" height="30" rx="5" fill="#DCE6DA"/><text x="64" y="532" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="400" text-anchor="start" letter-spacing="0">线性注意力 · 循环状态</text><rect x="52" y="548" width="396" height="30" rx="5" fill="#087F61"/><text x="64" y="570" fill="#FFFFFF" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="600" text-anchor="start" letter-spacing="0">全注意力 · KV cache</text><rect x="52" y="586" width="396" height="30" rx="5" fill="#DCE6DA"/><text x="64" y="608" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="400" text-anchor="start" letter-spacing="0">线性注意力 · 循环状态</text><rect x="52" y="624" width="396" height="30" rx="5" fill="#DCE6DA"/><text x="64" y="646" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="400" text-anchor="start" letter-spacing="0">线性注意力 · 循环状态</text><rect x="52" y="662" width="396" height="30" rx="5" fill="#DCE6DA"/><text x="64" y="684" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="400" text-anchor="start" letter-spacing="0">线性注意力 · 循环状态</text><rect x="52" y="700" width="396" height="30" rx="5" fill="#087F61"/><text x="64" y="722" fill="#FFFFFF" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="600" text-anchor="start" letter-spacing="0">全注意力 · KV cache</text><text x="52" y="772" fill="#B76B48" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0">3/4 的层没有 attention mask</text><rect x="496" y="252" width="452" height="212" rx="10" fill="#F1ECE3" stroke="#DFD5C6" stroke-width="2"/><text x="518" y="292" fill="#8D7F72" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0">补齐成等长</text><rect x="518" y="318" width="40" height="36" rx="5" fill="#C6D2C5"/><rect x="564" y="318" width="40" height="36" rx="5" fill="#C6D2C5"/><rect x="610" y="318" width="40" height="36" rx="5" fill="#C6D2C5"/><rect x="656" y="318" width="40" height="36" rx="5" fill="#C6D2C5"/><rect x="702" y="318" width="40" height="36" rx="5" fill="#C6D2C5"/><rect x="518" y="364" width="40" height="36" rx="5" fill="#C6D2C5"/><rect x="564" y="364" width="40" height="36" rx="5" fill="#C6D2C5"/><rect x="610" y="364" width="40" height="36" rx="5" fill="#C6D2C5"/><rect x="656" y="364" width="40" height="36" rx="5" fill="#D9B9A4"/><text x="676" y="388" fill="#8D5A3C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="600" text-anchor="middle" letter-spacing="0">pad</text><rect x="702" y="364" width="40" height="36" rx="5" fill="#D9B9A4"/><text x="722" y="388" fill="#8D5A3C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="600" text-anchor="middle" letter-spacing="0">pad</text><rect x="518" y="410" width="40" height="36" rx="5" fill="#C6D2C5"/><rect x="564" y="410" width="40" height="36" rx="5" fill="#C6D2C5"/><rect x="610" y="410" width="40" height="36" rx="5" fill="#C6D2C5"/><rect x="656" y="410" width="40" height="36" rx="5" fill="#C6D2C5"/><rect x="702" y="410" width="40" height="36" rx="5" fill="#D9B9A4"/><text x="722" y="434" fill="#8D5A3C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="600" text-anchor="middle" letter-spacing="0">pad</text><text x="496" y="500" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0">注意力层会忽略 pad，循环层不会——</text><rect x="496" y="520" width="452" height="58" rx="10" fill="#F1ECE3" stroke="#B76B48" stroke-width="2"/><text x="518" y="558" fill="#B76B48" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0">pad 会实打实地推进循环状态</text><rect x="496" y="600" width="452" height="250" rx="10" fill="#E7F0E3" stroke="#087F61" stroke-width="3"/><text x="518" y="640" fill="#087F61" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0">按长度分桶</text><rect x="518" y="666" width="40" height="38" rx="5" fill="#087F61"/><rect x="564" y="666" width="40" height="38" rx="5" fill="#087F61"/><rect x="610" y="666" width="40" height="38" rx="5" fill="#087F61"/><rect x="656" y="666" width="40" height="38" rx="5" fill="#087F61"/><rect x="702" y="666" width="40" height="38" rx="5" fill="#087F61"/><rect x="518" y="718" width="40" height="38" rx="5" fill="#087F61"/><rect x="564" y="718" width="40" height="38" rx="5" fill="#087F61"/><rect x="610" y="718" width="40" height="38" rx="5" fill="#087F61"/><rect x="656" y="718" width="40" height="38" rx="5" fill="#087F61"/><rect x="702" y="718" width="40" height="38" rx="5" fill="#087F61"/><rect x="518" y="770" width="40" height="38" rx="5" fill="#087F61"/><rect x="564" y="770" width="40" height="38" rx="5" fill="#087F61"/><rect x="610" y="770" width="40" height="38" rx="5" fill="#087F61"/><rect x="656" y="770" width="40" height="38" rx="5" fill="#087F61"/><rect x="702" y="770" width="40" height="38" rx="5" fill="#087F61"/><text x="518" y="834" fill="#087F61" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="21" font-weight="600" text-anchor="start" letter-spacing="0">桶内等长，一个 pad 都没有</text><rect x="52" y="880" width="896" height="110" rx="12" fill="#EDF2E8"/><text x="76" y="922" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="25" font-weight="700" text-anchor="start" letter-spacing="0">后果：21 条判据长度各不相同，能凑进同一桶的没几组。</text><text x="76" y="962" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0">打包只多赚 1.32 倍；真正的 9 倍来自「状态只算一次」。</text><line x1="52" y1="1020" x2="948" y2="1020" stroke="#D9DFD5" stroke-width="1"/><text x="52" y="1059" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="22" font-weight="500" text-anchor="start" letter-spacing="0">分桶是正确性要求：打包的结果必须和逐条重放一模一样。</text><text x="52" y="1093" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="400" text-anchor="start" letter-spacing="0">来源：quire/src/quire/fanout.py；循环状态也没法回退，「答完再倒回去」同样行不通</text><text x="948" y="1093" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="16" font-weight="400" text-anchor="end" letter-spacing="0">03 / 07</text></svg>