<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1600" role="img" aria-label="三种问题的答案住在三种空间里"><style>text{font-family:system-ui,-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC",sans-serif;fill:#24304a}.s{font-size:20px;fill:#66728b}.m{font-size:25px;font-weight:650}.l{font-size:18px;fill:#66728b}.n{font-size:34px;font-weight:750}.tiny{font-size:17px;fill:#66728b}.axis{stroke:#24304a;stroke-width:2}.grid{stroke:#e7e9f0;stroke-width:1}.dash{stroke-dasharray:7 7}</style><rect width="1100" height="1600" rx="28" fill="#fffdf8"/><g transform="translate(0 12) scale(1.25)"><rect x="40" y="30" width="800" height="5" rx="3" fill="#a8e0d1"/><text x="40" y="72" class="n" text-anchor="start">Choice</text><text x="40" y="104" class="s" text-anchor="start">恰好一个为真，概率加起来等于 1</text><text x="40" y="140" class="m" text-anchor="start">access</text><rect x="250" y="118" width="231.99999999999997" height="34" rx="17" fill="#a8e0d1"/><text x="840" y="140" class="m" text-anchor="end">0.58</text><text x="40" y="192" class="m" text-anchor="start">billing</text><rect x="250" y="170" width="160" height="34" rx="17" fill="#a8e0d1"/><text x="840" y="192" class="m" text-anchor="end">0.40</text><text x="40" y="244" class="m" text-anchor="start">shipping</text><rect x="250" y="222" width="8" height="34" rx="17" fill="#a8e0d1"/><text x="840" y="244" class="m" text-anchor="end">0.02</text><text x="40" y="300" class="s" text-anchor="start">所以「两件事同时为真」，这个空间里表达不出来。</text><rect x="40" y="350" width="800" height="5" rx="3" fill="#c9c4f0"/><text x="40" y="392" class="n" text-anchor="start">Score</text><text x="40" y="424" class="s" text-anchor="start">档位有序，两条分布的期望都是 3.0</text><text x="40" y="474" class="m" text-anchor="start">集中在两端 · 判断分裂</text><text x="840" y="474" class="s" text-anchor="end">期望 3.0</text><rect x="310" y="540" width="78" height="60" rx="12" fill="#c9c4f0"/><text x="349" y="632" class="s" text-anchor="middle">1</text><rect x="414" y="592.5" width="78" height="7.5" rx="12" fill="#c9c4f0"/><text x="453" y="632" class="s" text-anchor="middle">2</text><rect x="518" y="585" width="78" height="15" rx="12" fill="#c9c4f0"/><text x="557" y="632" class="s" text-anchor="middle">3</text><rect x="622" y="592.5" width="78" height="7.5" rx="12" fill="#c9c4f0"/><text x="661" y="632" class="s" text-anchor="middle">4</text><rect x="726" y="540" width="78" height="60" rx="12" fill="#c9c4f0"/><text x="765" y="632" class="s" text-anchor="middle">5</text><line x1="557" y1="435" x2="557" y2="606" stroke="#24304a" stroke-width="2" class="dash"/><text x="40" y="664" class="m" text-anchor="start">集中在中间 · 确实居中</text><text x="840" y="664" class="s" text-anchor="end">期望 3.0</text><rect x="310" y="782.5" width="78" height="7.5" rx="12" fill="#a8e0d1"/><text x="349" y="822" class="s" text-anchor="middle">1</text><rect x="414" y="760" width="78" height="30" rx="12" fill="#a8e0d1"/><text x="453" y="822" class="s" text-anchor="middle">2</text><rect x="518" y="715" width="78" height="75" rx="12" fill="#a8e0d1"/><text x="557" y="822" class="s" text-anchor="middle">3</text><rect x="622" y="760" width="78" height="30" rx="12" fill="#a8e0d1"/><text x="661" y="822" class="s" text-anchor="middle">4</text><rect x="726" y="782.5" width="78" height="7.5" rx="12" fill="#a8e0d1"/><text x="765" y="822" class="s" text-anchor="middle">5</text><line x1="557" y1="625" x2="557" y2="796" stroke="#24304a" stroke-width="2" class="dash"/><text x="40" y="890" class="s" text-anchor="start">只看分数不看分布，这个区别就丢了。</text><rect x="40" y="940" width="800" height="5" rx="3" fill="#ffb4a2"/><text x="40" y="982" class="n" text-anchor="start">Noul</text><text x="40" y="1014" class="s" text-anchor="start">彼此独立，不必归一化</text><text x="40" y="1050" class="m" text-anchor="start">紧急</text><rect x="250" y="1028" width="372" height="34" rx="17" fill="#ffb4a2"/><text x="840" y="1050" class="m" text-anchor="end">0.93</text><text x="40" y="1102" class="m" text-anchor="start">要退款</text><rect x="250" y="1080" width="284" height="34" rx="17" fill="#ffb4a2"/><text x="840" y="1102" class="m" text-anchor="end">0.71</text><text x="40" y="1154" class="m" text-anchor="start">老客户</text><rect x="250" y="1132" width="264" height="34" rx="17" fill="#ffb4a2"/><text x="840" y="1154" class="m" text-anchor="end">0.66</text><text x="40" y="1212" class="s" text-anchor="start">三条加起来 2.30，大于 1 也正常——它们互不牵制。</text></g></svg>