<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="1282" viewBox="0 0 1000 1282" role="img" aria-label="推理数据阅读 · 火眼金睛手卡"><rect width="1000" height="1282" fill="#F6F4ED"/><line x1="52.0" y1="65.0" x2="948.0" y2="65.0" stroke="#087F61" stroke-width="2"/><text x="52.0" y="45.0" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="17" font-weight="600" text-anchor="start" letter-spacing="3">INFERENCE  /  FIELD NOTES</text><text x="948.0" y="45.0" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="18" font-weight="500" text-anchor="end" letter-spacing="0">FIG. 09</text><text x="50.0" y="139.0" fill="#153E35" font-family="&quot;Songti SC&quot;,&quot;Noto Serif CJK SC&quot;,serif" font-size="44" font-weight="700" text-anchor="start" letter-spacing="0">推理数据阅读 · 火眼金睛手卡</text><text x="52.0" y="187.0" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">看到“快 N 倍”，先问这五个问题。</text><rect x="58.0" y="258.0" width="896.0" height="872.0" rx="18" fill="#DCD6C8"/><rect x="52.0" y="250.0" width="896.0" height="872.0" rx="18" fill="#FFFFFF" stroke="#D9DFD5" stroke-width="1.5"/><path d="M52 268 a18 18 0 0 1 18 -18 h860 a18 18 0 0 1 18 18 v40 h-896 Z" fill="#153E35"/><text x="80.0" y="293.0" fill="#FFFFFF" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0">问题</text><circle cx="314.0" cy="286.0" r="8" fill="none" stroke="#FFFFFF" stroke-width="2.6"/><line x1="320.0" y1="292.0" x2="326.0" y2="298.0" stroke="#FFFFFF" stroke-width="3"/><text x="334.0" y="293.0" fill="#FFFFFF" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0">去看</text><path d="M638 275 L649 295 L627 295 Z" fill="#E8B04B"/><text x="638.0" y="292.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="14" font-weight="800" text-anchor="middle" letter-spacing="0">!</text><text x="658.0" y="293.0" fill="#FFFFFF" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0">警惕</text><circle cx="92.0" cy="340.0" r="16" fill="#B76B48"/><text x="92.0" y="346.0" fill="#FFFFFF" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="0">1</text><text x="118.0" y="346.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0">比的是哪个指标？</text><g transform="translate(70.0 330.0) scale(1.2)"><text x="86.0" y="62.0" fill="#153E35" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0">tok/s</text><line x1="50.0" y1="70.0" x2="122.0" y2="70.0" stroke="#153E35" stroke-width="2"/><text x="86.0" y="90.0" fill="#B76B48" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="15" font-weight="700" text-anchor="middle" letter-spacing="0">GPU？</text><rect x="134.0" y="56.0" width="38.0" height="20.0" rx="4" fill="#B76B48"/><text x="153.0" y="71.0" fill="#FFFFFF" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="12" font-weight="700" text-anchor="middle" letter-spacing="0">P99</text></g><circle cx="318.0" cy="339.0" r="3.5" fill="#087F61"/><text x="330.0" y="344.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">纵轴和表头：比的是延迟还是吞吐</text><circle cx="318.0" cy="370.0" r="3.5" fill="#087F61"/><text x="330.0" y="375.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">平均值，还是 P95、P99</text><circle cx="318.0" cy="401.0" r="3.5" fill="#087F61"/><text x="330.0" y="406.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">分母是单个请求、每张 GPU、每个节点，</text><text x="330.0" y="429.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">还是整个集群</text><circle cx="642.0" cy="339.0" r="3.5" fill="#B76B48"/><text x="654.0" y="344.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">只说“快 N 倍”，不说快在哪里</text><circle cx="642.0" cy="370.0" r="3.5" fill="#B76B48"/><text x="654.0" y="375.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">只给平均值</text><circle cx="642.0" cy="401.0" r="3.5" fill="#B76B48"/><text x="654.0" y="406.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">“每秒多少 token”不说含不含输入、含</text><text x="654.0" y="429.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">不含缓存命中（OCI + WEKA）</text><rect x="53.0" y="466.0" width="894.0" height="158.0" rx="0" fill="#EDF2E8"/><line x1="70.0" y1="466.0" x2="930.0" y2="466.0" stroke="#D9DFD5" stroke-width="1"/><circle cx="92.0" cy="498.0" r="16" fill="#B76B48"/><text x="92.0" y="504.0" fill="#FFFFFF" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="0">2</text><text x="118.0" y="504.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0">工作负载什么样？</text><g transform="translate(70.0 488.0) scale(1.2)"><rect x="40.0" y="48.0" width="132.0" height="18.0" rx="3" fill="#BAC7BD"/><text x="46.0" y="62.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="0">输入</text><rect x="40.0" y="74.0" width="8.0" height="18.0" rx="2" fill="#087F61"/><text x="54.0" y="88.0" fill="#087F61" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="12" font-weight="700" text-anchor="start" letter-spacing="0">输出</text></g><circle cx="318.0" cy="497.0" r="3.5" fill="#087F61"/><text x="330.0" y="502.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">输入输出多长、比例多少</text><circle cx="318.0" cy="528.0" r="3.5" fill="#087F61"/><text x="330.0" y="533.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">什么内容，有没有重复的前缀</text><circle cx="318.0" cy="559.0" r="3.5" fill="#087F61"/><text x="330.0" y="564.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">定长请求，还是真实会话</text><circle cx="642.0" cy="497.0" r="3.5" fill="#B76B48"/><text x="654.0" y="502.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">输入输出比例极端（9K 对 10，10 万</text><text x="654.0" y="525.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">对 100）</text><circle cx="642.0" cy="551.0" r="3.5" fill="#B76B48"/><text x="654.0" y="556.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">“设置成尽量命中缓存”</text><circle cx="642.0" cy="582.0" r="3.5" fill="#B76B48"/><text x="654.0" y="587.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">用随机 token 测投机解码</text><line x1="70.0" y1="624.0" x2="930.0" y2="624.0" stroke="#D9DFD5" stroke-width="1"/><circle cx="92.0" cy="656.0" r="16" fill="#B76B48"/><text x="92.0" y="662.0" fill="#FFFFFF" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="0">3</text><text x="118.0" y="662.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0">负载有多高？</text><g transform="translate(70.0 646.0) scale(1.2)"><path d="M44 42 L44 96 L172 96" fill="none" stroke="#64736C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M52 48 Q74 86 166 90" fill="none" stroke="#087F61" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="52.0" cy="48.0" r="3.5" fill="#087F61"/><circle cx="64.0" cy="66.0" r="3.5" fill="#087F61"/><circle cx="86.0" cy="80.0" r="3.5" fill="#087F61"/><circle cx="120.0" cy="87.0" r="3.5" fill="#087F61"/><circle cx="160.0" cy="90.0" r="3.5" fill="#087F61"/><circle cx="64.0" cy="66.0" r="8" fill="none" stroke="#B76B48" stroke-width="2.5"/></g><circle cx="318.0" cy="655.0" r="3.5" fill="#087F61"/><text x="330.0" y="660.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">横轴是负载，还是交互速度、延迟</text><circle cx="318.0" cy="686.0" r="3.5" fill="#087F61"/><text x="330.0" y="691.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">给的是一条曲线，还是一个点</text><circle cx="318.0" cy="717.0" r="3.5" fill="#087F61"/><text x="330.0" y="722.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">在哪个交互速度下比</text><circle cx="642.0" cy="655.0" r="3.5" fill="#B76B48"/><text x="654.0" y="660.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">倍数取自几十个点里最好的一个</text><text x="654.0" y="683.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">（Predibase）</text><circle cx="642.0" cy="709.0" r="3.5" fill="#B76B48"/><text x="654.0" y="714.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">把“固定负载比延迟”和“固定延迟比负载”</text><text x="654.0" y="737.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">混为一谈（LMCache）</text><circle cx="642.0" cy="763.0" r="3.5" fill="#B76B48"/><text x="654.0" y="768.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">把设定的并发当成实际在处理的请求数</text><rect x="53.0" y="791.0" width="894.0" height="167.0" rx="0" fill="#EDF2E8"/><line x1="70.0" y1="791.0" x2="930.0" y2="791.0" stroke="#D9DFD5" stroke-width="1"/><circle cx="92.0" cy="823.0" r="16" fill="#B76B48"/><text x="92.0" y="829.0" fill="#FFFFFF" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="0">4</text><text x="118.0" y="829.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0">跟谁比？</text><g transform="translate(70.0 813.0) scale(1.2)"><line x1="44.0" y1="96.0" x2="150.0" y2="96.0" stroke="#64736C" stroke-width="1.5"/><rect x="54.0" y="74.0" width="28.0" height="22.0" rx="2" fill="#BAC7BD"/><text x="68.0" y="68.0" fill="#B76B48" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="18" font-weight="800" text-anchor="middle" letter-spacing="0">?</text><text x="98.0" y="86.0" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0">vs</text><rect x="114.0" y="50.0" width="28.0" height="46.0" rx="2" fill="#087F61"/></g><circle cx="318.0" cy="822.0" r="3.5" fill="#087F61"/><text x="330.0" y="827.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">基线的版本、调优程度、硬件、成本、</text><text x="330.0" y="850.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">测试日期</text><circle cx="318.0" cy="876.0" r="3.5" fill="#087F61"/><text x="330.0" y="881.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">是否用同一个压测工具</text><circle cx="642.0" cy="822.0" r="3.5" fill="#B76B48"/><text x="654.0" y="827.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">对手用的是“默认配置”</text><circle cx="642.0" cy="853.0" r="3.5" fill="#B76B48"/><text x="654.0" y="858.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">硬件相同，但多了一层缓存，软件费用没</text><text x="654.0" y="881.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">计入</text><circle cx="642.0" cy="907.0" r="3.5" fill="#B76B48"/><text x="654.0" y="912.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">不同时间、版本、压测工具的数据放在同</text><text x="654.0" y="935.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">一张图上</text><line x1="70.0" y1="958.0" x2="930.0" y2="958.0" stroke="#D9DFD5" stroke-width="1"/><circle cx="92.0" cy="990.0" r="16" fill="#B76B48"/><text x="92.0" y="996.0" fill="#FFFFFF" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="0">5</text><text x="118.0" y="996.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0">达标了吗？</text><g transform="translate(70.0 980.0) scale(1.2)"><line x1="42.0" y1="60.0" x2="172.0" y2="60.0" stroke="#B76B48" stroke-width="2" stroke-dasharray="6 4"/><text x="42.0" y="53.0" fill="#B76B48" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="12" font-weight="700" text-anchor="start" letter-spacing="0">SLO</text><circle cx="50.0" cy="84.0" r="4" fill="#087F61"/><circle cx="68.0" cy="76.0" r="4" fill="#087F61"/><circle cx="86.0" cy="88.0" r="4" fill="#087F61"/><circle cx="104.0" cy="72.0" r="4" fill="#087F61"/><circle cx="122.0" cy="82.0" r="4" fill="#087F61"/><circle cx="140.0" cy="78.0" r="4" fill="#087F61"/><circle cx="158.0" cy="50.0" r="4" fill="#B76B48"/></g><circle cx="318.0" cy="989.0" r="3.5" fill="#087F61"/><text x="330.0" y="994.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">P95、P99 和失败率</text><circle cx="318.0" cy="1020.0" r="3.5" fill="#087F61"/><text x="330.0" y="1025.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">质量评测</text><circle cx="318.0" cy="1051.0" r="3.5" fill="#087F61"/><text x="330.0" y="1056.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">SLO 的标准和分位数</text><circle cx="642.0" cy="989.0" r="3.5" fill="#B76B48"/><text x="654.0" y="994.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">只报吞吐，不报尾延迟</text><circle cx="642.0" cy="1020.0" r="3.5" fill="#B76B48"/><text x="654.0" y="1025.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">声称“SLO 稳定”，却不给标准和分位数</text><circle cx="642.0" cy="1051.0" r="3.5" fill="#B76B48"/><text x="654.0" y="1056.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">精度变了，却不报质量</text><line x1="52.0" y1="1182.0" x2="948.0" y2="1182.0" stroke="#D9DFD5" stroke-width="1"/><text x="52.0" y="1221.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="22" font-weight="500" text-anchor="start" letter-spacing="0">五个问题都答完，最后比 goodput：同时满足质量和延迟要求的那部分吞吐。</text><text x="52.0" y="1255.0" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">本文整理；括号里是第四节对应的案例</text><text x="948.0" y="1255.0" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="16" font-weight="400" text-anchor="end" letter-spacing="0">09 / 09</text></svg>