<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="980" viewBox="0 0 1000 980" role="img" aria-label="用户等的，不止一种时间"><rect width="1000" height="980" fill="#F6F4ED"/><line x1="52" y1="65" x2="948" y2="65" stroke="#087F61" stroke-width="2"/><text x="52" y="45" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="17" font-weight="600" text-anchor="start" letter-spacing="3">INFERENCE  /  FIELD NOTES</text><text x="948" y="45" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="18" font-weight="500" text-anchor="end" letter-spacing="0">FIG. 05</text><text x="50" y="139" fill="#153E35" font-family="&quot;Songti SC&quot;,&quot;Noto Serif CJK SC&quot;,serif" font-size="46" font-weight="700" text-anchor="start" letter-spacing="0">用户等的，不止一种时间</text><text x="52" y="187" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="24" font-weight="400" text-anchor="start" letter-spacing="0">多久开始出字、出字顺不顺、多久全部完成，是三个不同的问题。</text><text x="650.0" y="292" fill="#087F61" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="0">TPOT = (tN − t1) ÷ (N − 1)，即 ITL 的平均</text><line x1="400" y1="318" x2="900" y2="318" stroke="#087F61" stroke-width="3"/><path d="M889.1946347717678 323.21958640933474 L900 318 L889.1946347717678 312.78041359066526" fill="none" stroke="#087F61" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M410.8053652282321 312.78041359066526 L400 318 L410.8053652282321 323.21958640933474" fill="none" stroke="#087F61" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="255.0" y="392" fill="#B76B48" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="0">TTFT = t1 − t0</text><line x1="110" y1="418" x2="400" y2="418" stroke="#B76B48" stroke-width="3"/><path d="M389.1946347717679 423.21958640933474 L400 418 L389.1946347717679 412.78041359066526" fill="none" stroke="#B76B48" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M120.80536522823212 412.78041359066526 L110 418 L120.80536522823212 423.21958640933474" fill="none" stroke="#B76B48" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="460.0" y="490" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="17" font-weight="600" text-anchor="middle" letter-spacing="0">ITL(2)</text><line x1="406" y1="512" x2="514" y2="512" stroke="#64736C" stroke-width="2"/><path d="M503.1946347717679 517.2195864093347 L514 512 L503.1946347717679 506.78041359066526" fill="none" stroke="#64736C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M416.8053652282321 506.78041359066526 L406 512 L416.8053652282321 517.2195864093347" fill="none" stroke="#64736C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="610.0" y="490" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="17" font-weight="600" text-anchor="middle" letter-spacing="0">ITL(3)</text><line x1="526" y1="512" x2="694" y2="512" stroke="#64736C" stroke-width="2"/><path d="M683.1946347717678 517.2195864093347 L694 512 L683.1946347717678 506.78041359066526" fill="none" stroke="#64736C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M536.8053652282322 506.78041359066526 L526 512 L536.8053652282322 517.2195864093347" fill="none" stroke="#64736C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="800" y="520" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="26" font-weight="700" text-anchor="middle" letter-spacing="0">…</text><line x1="110" y1="600" x2="900" y2="600" stroke="#BAC7BD" stroke-width="4"/><circle cx="110" cy="600" r="9" fill="#087F61"/><text x="110" y="640" fill="#153E35" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="19" font-weight="700" text-anchor="middle" letter-spacing="0">t0</text><text x="110" y="668" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="17" font-weight="400" text-anchor="middle" letter-spacing="0">请求发出</text><circle cx="400" cy="600" r="9" fill="#087F61"/><text x="400" y="640" fill="#153E35" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="19" font-weight="700" text-anchor="middle" letter-spacing="0">t1</text><text x="400" y="668" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="17" font-weight="400" text-anchor="middle" letter-spacing="0">首 token</text><circle cx="520" cy="600" r="9" fill="#087F61"/><text x="520" y="640" fill="#153E35" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="19" font-weight="700" text-anchor="middle" letter-spacing="0">t2</text><text x="520" y="668" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="17" font-weight="400" text-anchor="middle" letter-spacing="0">第 2 个 token</text><circle cx="700" cy="600" r="9" fill="#087F61"/><text x="700" y="640" fill="#153E35" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="19" font-weight="700" text-anchor="middle" letter-spacing="0">t3</text><text x="700" y="668" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="17" font-weight="400" text-anchor="middle" letter-spacing="0">第 3 个 token</text><circle cx="900" cy="600" r="9" fill="#087F61"/><text x="900" y="640" fill="#153E35" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="19" font-weight="700" text-anchor="middle" letter-spacing="0">tN</text><text x="900" y="668" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="17" font-weight="400" text-anchor="middle" letter-spacing="0">最后 token</text><rect x="400" y="700" width="500" height="48" rx="8" fill="#EDF2E8"/><text x="650.0" y="731" fill="#087F61" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="18" font-weight="700" text-anchor="middle" letter-spacing="0">interactivity = 1 ÷ TPOT，单位 tok/s/user</text><line x1="110" y1="800" x2="900" y2="800" stroke="#153E35" stroke-width="3"/><path d="M889.1946347717678 805.2195864093347 L900 800 L889.1946347717678 794.7804135906653" fill="none" stroke="#153E35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M120.80536522823212 794.7804135906653 L110 800 L120.80536522823212 805.2195864093347" fill="none" stroke="#153E35" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="505.0" y="838" fill="#153E35" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="20" font-weight="700" text-anchor="middle" letter-spacing="0">E2E = tN − t0 = TTFT + (N − 1) × TPOT</text><line x1="52" y1="880" x2="948" y2="880" stroke="#D9DFD5" stroke-width="1"/><text x="52" y="919" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="22" font-weight="500" text-anchor="start" letter-spacing="0">TTFT、ITL、TPOT、E2E 各量一段；TPS 量的是整个系统，不在这条线上。</text><text x="52" y="953" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0">计时口径：客户端可见，参照 NVIDIA AIPerf 的指标定义</text><text x="948" y="953" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="16" font-weight="400" text-anchor="end" letter-spacing="0">05 / 05</text></svg>