" letter-spacing="0" data-max-width="684.0" data-label-slot="684.0">Layers or branches can cooperate; state cannot recover every historical detail</text><line x1="28" y1="1132" x2="692" y2="1132" stroke="#D9DFD5" stroke-width="1"></line><text x="28" y="1169" fill="#153E35" font-family="Arial,&quot;Helvetica Neue&quot;,sans-serif" font-size="19.4" font-weight="500" text-anchor="start" letter-spacing="0" data-max-width="664.0" data-label-slot="664.0">A candidate design: routing and proportions need training and task validation.</text><text x="28" y="1199" fill="#64736C" font-family="Arial,&quot;Helvetica Neue&quot;,sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0" data-max-width="587.0" data-label-slot="587.0">Basis: K3; Infini-attention; Memorizing Transformers. Not a reproduced design.</text><text x="691" y="1199" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="15" font-weight="500" text-anchor="end" letter-spacing="0" data-max-width="673.0" data-label-slot="673.0">01 / 02</text></svg>