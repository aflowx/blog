e x1="28" y1="732" x2="692" y2="732" stroke="#D9DFD5" stroke-width="1"></line><text x="28" y="769" fill="#153E35" font-family="Arial,&quot;Helvetica Neue&quot;,sans-serif" font-size="22.8" font-weight="500" text-anchor="start" letter-spacing="0" data-max-width="664.0" data-label-slot="664.0">Correlated keys can still interfere; this is not a retrieval guarantee.</text><text x="28" y="799" fill="#64736C" font-family="Arial,&quot;Helvetica Neue&quot;,sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0" data-max-width="587.0" data-label-slot="587.0">Source: delta rule. Unit key and β=1 are teaching conditions.</text><text x="691" y="799" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="15" font-weight="500" text-anchor="end" letter-spacing="0" data-max-width="673.0" data-label-slot="673.0">03 / 04</text></svg>