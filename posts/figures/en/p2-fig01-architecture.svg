<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1560" viewBox="0 0 1000 1560" role="img" aria-label="One call, five stages"><rect width="1000" height="1560" fill="#F6F4ED"/><line x1="52" y1="65" x2="948" y2="65" stroke="#087F61" stroke-width="2"/><text x="52" y="45" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" letter-spacing="3">QUIRE  /  BUILD LOG</text><text x="948" y="45" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="18" font-weight="500" text-anchor="end" letter-spacing="0">FIG. 01</text><text x="50" y="139" fill="#153E35" font-family="Georgia,&quot;Times New Roman&quot;,serif" font-size="46" font-weight="700" text-anchor="start" letter-spacing="0">One call, five stages</text><text x="52" y="187" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">The state is encoded once; each question adds two short suffixes to one fan-out.</text><rect x="44" y="250" width="84" height="158" rx="8" fill="#EDF2E8"/><text x="92" y="329.0" fill="#087F61" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="2" transform="rotate(-90 92 329.0)">INPUT</text><rect x="44" y="424" width="84" height="176" rx="8" fill="#EDF2E8"/><text x="92" y="512.0" fill="#087F61" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="2" transform="rotate(-90 92 512.0)">PLAN</text><text x="146" y="416" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0">① Plan (per question)</text><rect x="44" y="648" width="84" height="262" rx="8" fill="#EDF2E8"/><text x="92" y="779.0" fill="#087F61" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="2" transform="rotate(-90 92 779.0)">FAN-OUT</text><text x="146" y="640" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0">② Fan-out (once per call)</text><rect x="44" y="936" width="84" height="178" rx="8" fill="#EDF2E8"/><text x="92" y="1025.0" fill="#087F61" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="2" transform="rotate(-90 92 1025.0)">READ</text><text x="146" y="928" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0">③ Read (per suffix)</text><rect x="44" y="1140" width="84" height="176" rx="8" fill="#EDF2E8"/><text x="92" y="1228.0" fill="#087F61" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle" letter-spacing="2" transform="rotate(-90 92 1228.0)">COMBINE</text><text x="146" y="1132" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="22" font-weight="400" text-anchor="start" letter-spacing="0">④ Combine (per question)</text><rect x="146" y="250" width="340" height="104" rx="10" fill="#FFFFFF" stroke="#D9DFD5" stroke-width="2"/><text x="316.0" y="286" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="23" font-weight="600" text-anchor="middle" letter-spacing="0">State (one document)</text><text x="316.0" y="316" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">contract · log · web page</text><text x="316.0" y="344" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">encoded once, then read-only</text><rect x="510" y="250" width="438" height="104" rx="10" fill="#FFFFFF" stroke="#D9DFD5" stroke-width="2"/><text x="729.0" y="286" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="23" font-weight="600" text-anchor="middle" letter-spacing="0">Question × N</text><text x="729.0" y="316" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">instructions + criteria + kind</text><text x="729.0" y="344" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">kind ∈ choice / noul / score</text><line x1="440" y1="366" x2="440" y2="412" stroke="#087F61" stroke-width="3"/><path d="M434.78041359066526 401.1946347717679 L440 412 L445.21958640933474 401.1946347717679" fill="none" stroke="#087F61" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><line x1="729" y1="366" x2="729" y2="412" stroke="#087F61" stroke-width="3"/><path d="M723.7804135906653 401.1946347717679 L729 412 L734.2195864093347 401.1946347717679" fill="none" stroke="#087F61" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="146" y="424" width="802" height="176" rx="10" fill="#F4F6F1" stroke="#D9DFD5" stroke-width="2"/><rect x="168" y="448" width="234" height="128" rx="10" fill="#FFFFFF" stroke="#D9DFD5" stroke-width="2"/><text x="285.0" y="484" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="23" font-weight="600" text-anchor="middle" letter-spacing="0">Pick labels</text><text x="285.0" y="514" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">from the 26 letters</text><text x="285.0" y="542" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">one per option</text><text x="285.0" y="570" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">over 26 → wide path</text><line x1="410" y1="512" x2="438" y2="512" stroke="#087F61" stroke-width="3"/><path d="M427.1946347717679 517.2195864093347 L438 512 L427.1946347717679 506.78041359066526" fill="none" stroke="#087F61" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="446" y="448" width="234" height="128" rx="10" fill="#FFFFFF" stroke="#D9DFD5" stroke-width="2"/><text x="563.0" y="484" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="23" font-weight="600" text-anchor="middle" letter-spacing="0">Render suffixes</text><text x="563.0" y="514" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">original order</text><text x="563.0" y="542" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">rotated by one</text><text x="563.0" y="570" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">2 suffixes per question</text><line x1="688" y1="512" x2="716" y2="512" stroke="#087F61" stroke-width="3"/><path d="M705.1946347717678 517.2195864093347 L716 512 L705.1946347717678 506.78041359066526" fill="none" stroke="#087F61" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="724" y="448" width="202" height="128" rx="10" fill="#FFFFFF" stroke="#D9DFD5" stroke-width="2"/><text x="825.0" y="484" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="23" font-weight="600" text-anchor="middle" letter-spacing="0">Label token ids</text><text x="825.0" y="514" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">&quot; A&quot; or &quot;A&quot;?</text><text x="825.0" y="542" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">depends on the prompt</text><line x1="547" y1="610" x2="547" y2="640" stroke="#087F61" stroke-width="3"/><path d="M541.7804135906653 629.1946347717678 L547 640 L552.2195864093347 629.1946347717678" fill="none" stroke="#087F61" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="146" y="648" width="802" height="262" rx="10" fill="#E7F0E3" stroke="#087F61" stroke-width="3"/><text x="168" y="686" fill="#087F61" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="start" letter-spacing="0">Every suffix of every question goes into one pool</text><rect x="168" y="706" width="360" height="74" rx="10" fill="#FFFFFF" stroke="#D9DFD5" stroke-width="2"/><text x="348.0" y="752.0" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="23" font-weight="600" text-anchor="middle" letter-spacing="0">Bucket by token length</text><text x="348" y="806" fill="#087F61" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="0">equal lengths, never padded</text><text x="348" y="834" fill="#B76B48" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">a correctness rule, not a speed-up</text><rect x="560" y="706" width="366" height="74" rx="10" fill="#FFFFFF" stroke="#087F61" stroke-width="3"/><text x="743.0" y="752.0" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="23" font-weight="600" text-anchor="middle" letter-spacing="0">Prefill the state, once</text><text x="743" y="806" fill="#087F61" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="0">outside the batch loop</text><text x="743" y="834" fill="#B76B48" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">inside it, we ran 6× slower</text><rect x="168" y="856" width="758" height="34" rx="6" fill="#087F61"/><text x="547" y="880" fill="#FFFFFF" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="middle" letter-spacing="0">copy cache × batch  →  one forward pass  →  answer-slot logits (B, vocab)</text><line x1="547" y1="918" x2="547" y2="950" stroke="#087F61" stroke-width="3"/><path d="M541.7804135906653 939.1946347717678 L547 950 L552.2195864093347 939.1946347717678" fill="none" stroke="#087F61" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="146" y="936" width="802" height="178" rx="10" fill="#F4F6F1" stroke="#D9DFD5" stroke-width="2"/><rect x="168" y="960" width="234" height="130" rx="10" fill="#FFFFFF" stroke="#D9DFD5" stroke-width="2"/><text x="285" y="1006" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="middle" letter-spacing="0">Take label logits</text><text x="285" y="1044" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">one number per option</text><line x1="406" y1="1025" x2="426" y2="1025" stroke="#087F61" stroke-width="3"/><path d="M415.1946347717679 1030.2195864093349 L426 1025 L415.1946347717679 1019.7804135906653" fill="none" stroke="#087F61" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="430" y="960" width="234" height="130" rx="10" fill="#FFFFFF" stroke="#D9DFD5" stroke-width="2"/><text x="547" y="1006" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="middle" letter-spacing="0">softmax</text><text x="547" y="1044" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">→ probabilities</text><line x1="668" y1="1025" x2="688" y2="1025" stroke="#087F61" stroke-width="3"/><path d="M677.1946347717678 1030.2195864093349 L688 1025 L677.1946347717678 1019.7804135906653" fill="none" stroke="#087F61" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="692" y="960" width="234" height="130" rx="10" fill="#FFFFFF" stroke="#D9DFD5" stroke-width="2"/><text x="809" y="1006" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="middle" letter-spacing="0">Re-index</text><text x="809" y="1044" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">undo the rotation</text><line x1="547" y1="1122" x2="547" y2="1154" stroke="#087F61" stroke-width="3"/><path d="M541.7804135906653 1143.1946347717678 L547 1154 L552.2195864093347 1143.1946347717678" fill="none" stroke="#087F61" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="146" y="1140" width="802" height="176" rx="10" fill="#F4F6F1" stroke="#D9DFD5" stroke-width="2"/><rect x="168" y="1164" width="250" height="128" rx="10" fill="#FFFFFF" stroke="#D9DFD5" stroke-width="2"/><text x="293.0" y="1200" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="23" font-weight="600" text-anchor="middle" letter-spacing="0">Average the two</text><text x="293.0" y="1230" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">each option read under</text><text x="293.0" y="1258" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">two letters: bias evens out</text><line x1="426" y1="1228" x2="454" y2="1228" stroke="#087F61" stroke-width="3"/><path d="M443.1946347717679 1233.2195864093349 L454 1228 L443.1946347717679 1222.7804135906651" fill="none" stroke="#087F61" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><rect x="462" y="1164" width="464" height="128" rx="10" fill="#FFFFFF" stroke="#087F61" stroke-width="3"/><text x="482" y="1198" fill="#087F61" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="24" font-weight="700" text-anchor="start" letter-spacing="0">Answer</text><text x="482" y="1230" fill="#153E35" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="18" font-weight="600" text-anchor="start" letter-spacing="0">choice / probabilities</text><text x="730" y="1230" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0">answer, probabilities</text><text x="482" y="1256" fill="#153E35" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="18" font-weight="600" text-anchor="start" letter-spacing="0">margin</text><text x="730" y="1256" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0">top1 − top2: abstain?</text><text x="482" y="1282" fill="#153E35" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="18" font-weight="600" text-anchor="start" letter-spacing="0">state_tokens</text><text x="730" y="1282" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="18" font-weight="400" text-anchor="start" letter-spacing="0">what it actually read</text><line x1="52" y1="1356" x2="948" y2="1356" stroke="#D9DFD5" stroke-width="1"/><text x="52" y="1392" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="21" font-weight="500" text-anchor="start" letter-spacing="0">Cached: the state KV (once per call) · label token ids (once per model)</text><text x="52" y="1426" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="21" font-weight="400" text-anchor="start" letter-spacing="0">Tokens read per call = state × 1 + Σ question suffixes</text><line x1="52" y1="1460" x2="948" y2="1460" stroke="#D9DFD5" stroke-width="1"/><text x="52" y="1499" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start" letter-spacing="0">Only stage ② touches the model. The rest is indexing, softmax and an average.</text><text x="52" y="1533" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Source: quire/src/quire/engine.py and fanout.py (default config: two option orders)</text><text x="948" y="1533" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="16" font-weight="400" text-anchor="end" letter-spacing="0">01 / 08</text></svg>