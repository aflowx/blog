und"></path><text x="517" y="506" fill="#153E35" font-family="Arial,&quot;Helvetica Neue&quot;,sans-serif" font-size="23" font-weight="500" text-anchor="middle" letter-spacing="0" data-max-width="370.0" data-label-slot="370.0">Divide by accumulated weight 2</text><rect x="481" y="529" width="62" height="34" rx="3" fill="#087F61"></rect><text x="512" y="554" fill="#FFFFFF" font-family="Arial,&quot;Helvetica Neue&quot;,sans-serif" font-size="24" font-weight="600" text-anchor="middle" letter-spacing="0" data-max-width="380.0" data-label-slot="50.0">½</text><rect x="554" y="529" width="62" height="34" rx="3" fill="#B76B48"></rect><text x="585" y="554" fill="#FFFFFF" font-family="Arial,&quot;Helvetica Neue&quot;,sans-serif" font-size="24" font-weight="600" text-anchor="middle" letter-spacing="0" data-max-width="234.0" data-label-slot="50.0">½</text><text x="360" y="676" fill="#64736C" font-family="Arial,&quot;Helvetica Neue&quot;,sans-serif" font-size="23" font-weight="500" text-anchor="middle" letter-spacing="0" data-max-width="684.0" data-label-slot="684.0">The result averages both values; it does not return the latest write</text><text x="360" y="739" fill="#64736C" font-family="Arial,&quot;Helvetica Neue&quot;,sans-serif" font-size="22.7" font-weight="500" text-anchor="middle" letter-spacing="0" data-max-width="684.0" data-label-slot="684.0">Similar directions can interfere; larger states still have finite capacity</text><line x1="28" y1="852" x2="692" y2="852" stroke="#D9DFD5" stroke-width="1"></line><text x="28" y="889" fill="#153E35" font-family="Arial,&quot;Helvetica Neue&quot;,sans-serif" font-size="20.8" font-weight="500" text-anchor="start" letter-spacing="0" data-max-width="664.0" data-label-slot="664.0">Fixed state size gives up independent storage of historical contributions.</text><text x="28" y="919" fill="#64736C" font-family="Arial,&quot;Helvetica Neue&quot;,sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0" data-max-width="587.0" data-label-slot="587.0">Source: Linear Transformer Eq.9–12. Nonnegative-kernel toy example.</text><text x="691" y="919" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="15" font-weight="500" text-anchor="end" letter-spacing="0" data-max-width="673.0" data-label-slot="673.0">03 / 07</text></svg>