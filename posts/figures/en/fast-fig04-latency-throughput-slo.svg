t><text x="540.0" y="884.0" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="middle" letter-spacing="0">P99 end-to-end latency (s)   ← lower is better</text><text x="68" y="560.0" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="middle" letter-spacing="0" transform="rotate(-90 68 560.0)">throughput (tok/s/GPU)   higher is better →</text><line x1="52" y1="900" x2="948" y2="900" stroke="#D9DFD5" stroke-width="1"/><text x="52" y="939" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start" letter-spacing="0">Keep the points inside the SLO, then take the highest throughput.</text><text x="52" y="973" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">Illustration: these three points are not measurements of any product</text><text x="948" y="973" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="16" font-weight="400" text-anchor="end" letter-spacing="0">04 / 05</text></svg>