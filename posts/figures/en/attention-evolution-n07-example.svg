ot="87.9">A</text><text x="225" y="586" fill="#B76B48" font-family="Arial,&quot;Helvetica Neue&quot;,sans-serif" font-size="25" font-weight="600" text-anchor="middle" letter-spacing="0" data-max-width="414.0" data-label-slot="88.1">B</text><rect x="466" y="514" width="54" height="26" rx="3" fill="#087F61"></rect><rect x="560" y="436" width="54" height="104" rx="3" fill="#B76B48"></rect><line x1="459" y1="542" x2="622" y2="542" stroke="#D9DFD5" stroke-width="1"></line><text x="493" y="586" fill="#087F61" font-family="Arial,&quot;Helvetica Neue&quot;,sans-serif" font-size="25" font-weight="600" text-anchor="middle" letter-spacing="0" data-max-width="418.0" data-label-slot="87.9">A</text><text x="587" y="586" fill="#B76B48" font-family="Arial,&quot;Helvetica Neue&quot;,sans-serif" font-size="25" font-weight="600" text-anchor="middle" letter-spacing="0" data-max-width="230.0" data-label-slot="88.1">B</text><text x="178" y="650" fill="#64736C" font-family="Arial,&quot;Helvetica Neue&quot;,sans-serif" font-size="23" font-weight="500" text-anchor="middle" letter-spacing="0" data-max-width="320.0" data-label-slot="320.0">A and B contribute equally</text><text x="540" y="650" fill="#64736C" font-family="Arial,&quot;Helvetica Neue&quot;,sans-serif" font-size="22" font-weight="500" text-anchor="middle" letter-spacing="0" data-max-width="324.0" data-label-slot="324.0">Weaken A; write B at full strength</text><line x1="178" y1="680" x2="178" y2="721" stroke="#64736C" stroke-width="2"></line><path d="M172.78041359066523 710.1946347717678 L178 721 L183.21958640933477 710.1946347717678" fill="none" stroke="#64736C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><line x1="540" y1="680" x2="540" y2="721" stroke="#64736C" stroke-width="2"></line><path d="M534.7804135906653 710.1946347717678 L540 721 L545.2195864093347 710.1946347717678" fill="none" stroke="#64736C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><rect x="127" y="744" widt