label-slot="234.0">One request modifies the page</text><line x1="28" y1="1062" x2="692" y2="1062" stroke="#D9DFD5" stroke-width="1"></line><text x="28" y="1099" fill="#153E35" font-family="Arial,&quot;Helvetica Neue&quot;,sans-serif" font-size="20.8" font-weight="500" text-anchor="start" letter-spacing="0" data-max-width="664.0" data-label-slot="664.0">Physical storage changes; the logical attention sequence stays ordered.</text><text x="28" y="1129" fill="#64736C" font-family="Arial,&quot;Helvetica Neue&quot;,sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0" data-max-width="587.0" data-label-slot="587.0">Source: PagedAttention §4 / Fig.3–5. Illustrative allocation only.</text><text x="691" y="1129" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="15" font-weight="500" text-anchor="end" letter-spacing="0" data-max-width="673.0" data-label-slot="673.0">04 / 05</text></svg>