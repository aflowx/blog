<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="860" viewBox="0 0 1000 860" role="img" aria-label="What’s inside “tokens per second”"><rect width="1000" height="860" fill="#F6F4ED"/><line x1="52.0" y1="65.0" x2="948.0" y2="65.0" stroke="#087F61" stroke-width="2"/><text x="52.0" y="45.0" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="17" font-weight="600" text-anchor="start" letter-spacing="3">INFERENCE  /  FIELD NOTES</text><text x="948.0" y="45.0" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="18" font-weight="500" text-anchor="end" letter-spacing="0">FIG. 03</text><text x="50.0" y="139.0" fill="#153E35" font-family="&quot;Songti SC&quot;,&quot;Noto Serif CJK SC&quot;,serif" font-size="44" font-weight="700" text-anchor="start" letter-spacing="0">What’s inside “tokens per second”</text><text x="52.0" y="187.0" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">Two throughput figures, both almost entirely input tokens.</text><defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#FFFFFF" stroke-width="3" opacity=".55"/></pattern></defs><text x="52.0" y="256.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="21" font-weight="700" text-anchor="start" letter-spacing="0">InferenceX run: DeepSeek-V4-Pro on 8×B200 (vLLM)</text><text x="52.0" y="284.0" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Agent-session replay · 32 concurrent sessions · 1 hour</text><rect x="52.0" y="300.0" width="890.2" height="64.0" rx="0" fill="#BAC7BD"/><rect x="942.2" y="300.0" width="5.8" height="64.0" rx="0" fill="#087F61"/><text x="70.0" y="341.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0">Input 99.3%</text><text x="948.0" y="408.0" fill="#087F61" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="18" font-weight="700" text-anchor="end" letter-spacing="0">Output 0.7%</text><path d="M52 369 L52 378 L921.2 378 L921.2 369" fill="none" stroke="#B76B48" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="408.0" fill="#B76B48" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="17" font-weight="600" text-anchor="start" letter-spacing="0">97.65% of input repeats earlier context</text><text x="70.0" y="434.0" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">(actual cache hits not reported)</text><text x="52.0" y="486.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="600" text-anchor="start" letter-spacing="0">Input: 138,058 tok/s</text><text x="452.0" y="486.0" fill="#087F61" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0">Output: 906 tok/s</text><text x="52.0" y="556.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="21" font-weight="700" text-anchor="start" letter-spacing="0">Oracle + WEKA: “about 2 million tokens per second”</text><text x="52.0" y="584.0" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Each turn: 100,000 tokens in, 100 out; configured to maximize cache hits</text><rect x="52.0" y="600.0" width="895.1" height="64.0" rx="0" fill="#BAC7BD"/><rect x="52.0" y="600" width="895.1" height="64" fill="url(#hatch)"/><rect x="947.1" y="600.0" width="4.0" height="64.0" rx="0" fill="#087F61"/><text x="70.0" y="641.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0">Input 99.9% (hit rate not reported)</text><text x="948.0" y="696.0" fill="#087F61" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="17" font-weight="700" text-anchor="end" letter-spacing="0">Output 0.1% ≈ 2,000 tok/s (our estimate)</text><line x1="52.0" y1="760.0" x2="948.0" y2="760.0" stroke="#D9DFD5" stroke-width="1"/><text x="52.0" y="799.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="22" font-weight="500" text-anchor="start" letter-spacing="0">Both count as “throughput”; very little of it is generated output.</text><text x="52.0" y="833.0" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Sources: InferenceX run (2026-09-19); Oracle / WEKA (2026-05-13); estimate ours</text><text x="948.0" y="833.0" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="16" font-weight="400" text-anchor="end" letter-spacing="0">03 / 09</text></svg>