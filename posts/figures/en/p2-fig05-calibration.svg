<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1250" viewBox="0 0 1000 1250" role="img" aria-label="Reorder the options, and answers flip"><rect width="1000" height="1250" fill="#F6F4ED"/><line x1="52" y1="65" x2="948" y2="65" stroke="#087F61" stroke-width="2"/><text x="52" y="45" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" letter-spacing="3">QUIRE  /  BUILD LOG</text><text x="948" y="45" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="18" font-weight="500" text-anchor="end" letter-spacing="0">FIG. 05</text><text x="50" y="139" fill="#153E35" font-family="Georgia,&quot;Times New Roman&quot;,serif" font-size="46" font-weight="700" text-anchor="start" letter-spacing="0">Reorder the options, and answers flip</text><text x="52" y="187" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">A second, rotated read, averaged in: no answer changes, but confidence matches accuracy.</text><text x="52" y="256" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="25" font-weight="600" text-anchor="start" letter-spacing="0">One hard item, options in a different order</text><text x="292" y="296" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0">original order</text><text x="512" y="296" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0">rotated by one</text><text x="732" y="296" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0">average of both</text><text x="52" y="342" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0">confirm at level 3</text><rect x="292" y="322" width="150" height="24" rx="4" fill="#E7ECE2"/><rect x="292" y="322" width="3" height="24" rx="4" fill="#B9C7BD"/><text x="452" y="341" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="19" font-weight="600" text-anchor="start" letter-spacing="0">0.01</text><rect x="512" y="322" width="150" height="24" rx="4" fill="#E7ECE2"/><rect x="512" y="322" width="114.60000000000001" height="24" rx="4" fill="#B76B48"/><text x="672" y="341" fill="#B76B48" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="19" font-weight="600" text-anchor="start" letter-spacing="0">0.76</text><rect x="732" y="322" width="150" height="24" rx="4" fill="#E7ECE2"/><rect x="732" y="322" width="58.35" height="24" rx="4" fill="#B9C7BD"/><text x="892" y="341" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="19" font-weight="600" text-anchor="start" letter-spacing="0">0.39</text><text x="52" y="400" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0">reject: over capacity</text><rect x="292" y="380" width="150" height="24" rx="4" fill="#E7ECE2"/><rect x="292" y="380" width="3.3" height="24" rx="4" fill="#B9C7BD"/><text x="452" y="399" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="19" font-weight="600" text-anchor="start" letter-spacing="0">0.02</text><rect x="512" y="380" width="150" height="24" rx="4" fill="#E7ECE2"/><rect x="512" y="380" width="3" height="24" rx="4" fill="#B9C7BD"/><text x="672" y="399" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="19" font-weight="600" text-anchor="start" letter-spacing="0">0.01</text><rect x="732" y="380" width="150" height="24" rx="4" fill="#E7ECE2"/><rect x="732" y="380" width="3" height="24" rx="4" fill="#B9C7BD"/><text x="892" y="399" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="19" font-weight="600" text-anchor="start" letter-spacing="0">0.01</text><rect x="44" y="426" width="912" height="50" rx="8" fill="#EDF2E8"/><text x="52" y="458" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="20" font-weight="600" text-anchor="start" letter-spacing="0">needs steward sign-off</text><rect x="292" y="438" width="150" height="24" rx="4" fill="#E7ECE2"/><rect x="292" y="438" width="142.65" height="24" rx="4" fill="#087F61"/><text x="452" y="457" fill="#087F61" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="19" font-weight="600" text-anchor="start" letter-spacing="0">0.95</text><rect x="512" y="438" width="150" height="24" rx="4" fill="#E7ECE2"/><rect x="512" y="438" width="28.95" height="24" rx="4" fill="#087F61"/><text x="672" y="457" fill="#087F61" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="19" font-weight="600" text-anchor="start" letter-spacing="0">0.19</text><rect x="732" y="438" width="150" height="24" rx="4" fill="#E7ECE2"/><rect x="732" y="438" width="85.8" height="24" rx="4" fill="#087F61"/><text x="892" y="457" fill="#087F61" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="19" font-weight="600" text-anchor="start" letter-spacing="0">0.57</text><text x="52" y="516" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0">switch to level 4</text><rect x="292" y="496" width="150" height="24" rx="4" fill="#E7ECE2"/><rect x="292" y="496" width="3" height="24" rx="4" fill="#B9C7BD"/><text x="452" y="515" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="19" font-weight="600" text-anchor="start" letter-spacing="0">0.01</text><rect x="512" y="496" width="150" height="24" rx="4" fill="#E7ECE2"/><rect x="512" y="496" width="5.7" height="24" rx="4" fill="#B9C7BD"/><text x="672" y="515" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="19" font-weight="600" text-anchor="start" letter-spacing="0">0.04</text><rect x="732" y="496" width="150" height="24" rx="4" fill="#E7ECE2"/><rect x="732" y="496" width="3.9" height="24" rx="4" fill="#B9C7BD"/><text x="892" y="515" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="19" font-weight="600" text-anchor="start" letter-spacing="0">0.03</text><text x="52" y="580" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0">The right answer is &quot;needs steward sign-off&quot;: 0.95 in the original order, 0.19 once rotated.</text><text x="52" y="610" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0">Averaged: 0.57, still right and no longer over-sure. 21 of the 73 multiple-choice hard items flip like this.</text><line x1="52" y1="650" x2="948" y2="650" stroke="#D9DFD5" stroke-width="1"/><text x="52" y="698" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="23" font-weight="600" text-anchor="start" letter-spacing="0">Stated confidence vs actual accuracy (111 public hard items)</text><line x1="130.0" y1="1080" x2="130.0" y2="750" stroke="#D9DFD5" stroke-width="1"/><text x="130.0" y="1108" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="18" font-weight="400" text-anchor="middle" letter-spacing="0">0.2</text><line x1="247.5" y1="1080" x2="247.5" y2="750" stroke="#D9DFD5" stroke-width="1"/><text x="247.5" y="1108" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="18" font-weight="400" text-anchor="middle" letter-spacing="0">0.4</text><line x1="365.0" y1="1080" x2="365.0" y2="750" stroke="#D9DFD5" stroke-width="1"/><text x="365.0" y="1108" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="18" font-weight="400" text-anchor="middle" letter-spacing="0">0.6</text><line x1="482.50000000000006" y1="1080" x2="482.50000000000006" y2="750" stroke="#D9DFD5" stroke-width="1"/><text x="482.50000000000006" y="1108" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="18" font-weight="400" text-anchor="middle" letter-spacing="0">0.8</text><line x1="600.0" y1="1080" x2="600.0" y2="750" stroke="#D9DFD5" stroke-width="1"/><text x="600.0" y="1108" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="18" font-weight="400" text-anchor="middle" letter-spacing="0">1.0</text><line x1="130" y1="1080" x2="600.0" y2="1080" stroke="#D9DFD5" stroke-width="1"/><text x="118" y="1086" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="18" font-weight="400" text-anchor="end" letter-spacing="0">0.00</text><line x1="130" y1="997.5" x2="600.0" y2="997.5" stroke="#D9DFD5" stroke-width="1"/><text x="118" y="1003.5" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="18" font-weight="400" text-anchor="end" letter-spacing="0">0.25</text><line x1="130" y1="915.0" x2="600.0" y2="915.0" stroke="#D9DFD5" stroke-width="1"/><text x="118" y="921.0" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="18" font-weight="400" text-anchor="end" letter-spacing="0">0.50</text><line x1="130" y1="832.5" x2="600.0" y2="832.5" stroke="#D9DFD5" stroke-width="1"/><text x="118" y="838.5" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="18" font-weight="400" text-anchor="end" letter-spacing="0">0.75</text><line x1="130" y1="750.0" x2="600.0" y2="750.0" stroke="#D9DFD5" stroke-width="1"/><text x="118" y="756.0" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="18" font-weight="400" text-anchor="end" letter-spacing="0">1.00</text><line x1="130.0" y1="1014.0" x2="600.0" y2="750" stroke="#9AA89E" stroke-width="2" stroke-dasharray="6 6"/><text x="558.875" y="745.3" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="end" letter-spacing="0">perfect</text><text x="365.0" y="1136" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">stated confidence</text><text x="60" y="915.0" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0" transform="rotate(-90 60 915.0)">actual accuracy</text><path d="M162.9,915.0 L224.0,997.5 L287.45000000000005,929.85 L335.0375,877.05 L389.675,978.36 L452.53749999999997,841.74 L514.2249999999999,865.5 L574.7375,785.31" fill="none" stroke="#B76B48" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="162.9" cy="915.0" r="7.2" fill="#F6F4ED" stroke="#B76B48" stroke-width="3"/><circle cx="224.0" cy="997.5" r="7.2" fill="#F6F4ED" stroke="#B76B48" stroke-width="3"/><circle cx="287.45000000000005" cy="929.85" r="9.30659966456864" fill="#F6F4ED" stroke="#B76B48" stroke-width="3"/><circle cx="335.0375" cy="877.05" r="9.768882040742383" fill="#F6F4ED" stroke="#B76B48" stroke-width="3"/><circle cx="389.675" cy="978.36" r="9.768882040742383" fill="#F6F4ED" stroke="#B76B48" stroke-width="3"/><circle cx="452.53749999999997" cy="841.74" r="10.788225099390857" fill="#F6F4ED" stroke="#B76B48" stroke-width="3"/><circle cx="514.2249999999999" cy="865.5" r="11.155417527999328" fill="#F6F4ED" stroke="#B76B48" stroke-width="3"/><circle cx="574.7375" cy="785.31" r="12.46640419540669" fill="#F6F4ED" stroke="#B76B48" stroke-width="3"/><path d="M177.0,1080 L222.23749999999998,915.0 L289.2125,970.11 L334.45,896.52 L391.4375,888.9300000000001 L458.41249999999997,838.11 L511.2875,867.81 L578.2624999999999,764.19" fill="none" stroke="#087F61" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="177.0" cy="1080" r="6.262741699796953" fill="#087F61"/><circle cx="222.23749999999998" cy="915.0" r="8.525483399593906" fill="#087F61"/><circle cx="289.2125" cy="970.11" r="9.542562584220407" fill="#087F61"/><circle cx="334.45" cy="896.52" r="10.788225099390857" fill="#087F61"/><circle cx="391.4375" cy="888.9300000000001" r="10.974238309665079" fill="#087F61"/><circle cx="458.41249999999997" cy="838.11" r="10.196773353931867" fill="#087F61"/><circle cx="511.2875" cy="867.81" r="9.986651818838308" fill="#087F61"/><circle cx="578.2624999999999" cy="764.19" r="11.67333043730035" fill="#087F61"/><line x1="401.675" y1="986.36" x2="420" y2="1010" stroke="#B76B48" stroke-width="1.5"/><text x="300" y="1030" fill="#B76B48" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="18" font-weight="600" text-anchor="start" letter-spacing="0">13 items at ~64%: only 4 right</text><circle cx="660" cy="751" r="6" fill="#F6F4ED" stroke="#B76B48" stroke-width="3"/><text x="678" y="760" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0">one read</text><circle cx="660" cy="787" r="5" fill="#087F61"/><text x="678" y="796" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0">plus one rotated read, averaged</text><text x="660" y="866" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0">ECE</text><text x="660" y="910" fill="#B76B48" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="34" font-weight="700" text-anchor="start" letter-spacing="0">0.118</text><line x1="768" y1="898" x2="810" y2="898" stroke="#64736C" stroke-width="3"/><path d="M799.1946347717678 903.2195864093347 L810 898 L799.1946347717678 892.7804135906653" fill="none" stroke="#64736C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="822" y="910" fill="#087F61" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="34" font-weight="700" text-anchor="start" letter-spacing="0">0.073</text><text x="660" y="952" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0">correct</text><text x="660" y="996" fill="#B76B48" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="34" font-weight="700" text-anchor="start" letter-spacing="0">71</text><line x1="768" y1="984" x2="810" y2="984" stroke="#64736C" stroke-width="3"/><path d="M799.1946347717678 989.2195864093347 L810 984 L799.1946347717678 978.7804135906653" fill="none" stroke="#64736C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="822" y="996" fill="#087F61" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="34" font-weight="700" text-anchor="start" letter-spacing="0">71</text><text x="660" y="1060" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">no answer changed; dot size = items in bin</text><line x1="52" y1="1150" x2="948" y2="1150" stroke="#D9DFD5" stroke-width="1"/><text x="52" y="1189" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start" letter-spacing="0">The cost is one extra suffix per question. The document is shared, not re-read.</text><text x="52" y="1223" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Source: quire/results/jevbench/quire-p1 and quire-p2 (BF16); the rotated read is derived from the two</text><text x="948" y="1223" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="16" font-weight="400" text-anchor="end" letter-spacing="0">05 / 08</text></svg>