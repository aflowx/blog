h="684.0" data-label-slot="684.0">Mixed vector → later layers → next-token prediction</text><line x1="28" y1="842" x2="692" y2="842" stroke="#D9DFD5" stroke-width="1"></line><text x="28" y="879" fill="#153E35" font-family="Arial,&quot;Helvetica Neue&quot;,sans-serif" font-size="22.1" font-weight="500" text-anchor="start" letter-spacing="0" data-max-width="664.0" data-label-slot="664.0">The output mixes value components; it does not simply pick a word.</text><text x="28" y="909" fill="#64736C" font-family="Arial,&quot;Helvetica Neue&quot;,sans-serif" font-size="15" font-weight="400" text-anchor="start" letter-spacing="0" data-max-width="587.0" data-label-slot="587.0">Source: Transformer §3.2. Toy text chunks, weights and dimensions.</text><text x="691" y="909" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="15" font-weight="500" text-anchor="end" letter-spacing="0" data-max-width="673.0" data-label-slot="673.0">01 / 05</text></svg>