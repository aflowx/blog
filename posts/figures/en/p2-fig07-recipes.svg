<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1050" viewBox="0 0 1000 1050" role="img" aria-label="Our LoRA recipe, beside Winnow-12B"><rect width="1000" height="1050" fill="#F6F4ED"/><line x1="52" y1="65" x2="948" y2="65" stroke="#087F61" stroke-width="2"/><text x="52" y="45" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="17" font-weight="600" text-anchor="start" letter-spacing="3">QUIRE  /  BUILD LOG</text><text x="948" y="45" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="18" font-weight="500" text-anchor="end" letter-spacing="0">FIG. 07</text><text x="50" y="139" fill="#153E35" font-family="Georgia,&quot;Times New Roman&quot;,serif" font-size="46" font-weight="700" text-anchor="start" letter-spacing="0">Our LoRA recipe, beside Winnow-12B</text><text x="52" y="187" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">A similar direction, with training data we designed. The hard tier hasn&#x27;t moved yet.</text><rect x="300" y="246" width="320" height="58" rx="10" fill="#F4E3D9"/><text x="460.0" y="284" fill="#B76B48" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="0">Quire (LoRA)</text><rect x="628" y="246" width="320" height="58" rx="10" fill="#DFEBDC"/><text x="788.0" y="284" fill="#087F61" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="middle" letter-spacing="0">Winnow-12B (reference)</text><text x="52" y="356" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start" letter-spacing="0">Source</text><rect x="300" y="324" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#D9DFD5" stroke-width="2"/><text x="460.0" y="355" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">six scenario generators</text><rect x="628" y="324" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#D9DFD5" stroke-width="2"/><text x="788.0" y="355" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">private synthetic data</text><text x="52" y="418" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start" letter-spacing="0">Gold labels</text><rect x="300" y="386" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#D9DFD5" stroke-width="2"/><text x="460.0" y="417" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">computed, exact</text><rect x="628" y="386" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#D9DFD5" stroke-width="2"/><text x="788.0" y="417" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">not published</text><text x="52" y="480" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start" letter-spacing="0">Length</text><rect x="300" y="448" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#D9DFD5" stroke-width="2"/><text x="460.0" y="479" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">long state · 8k cap</text><rect x="628" y="448" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#D9DFD5" stroke-width="2"/><text x="788.0" y="479" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">long state · 8k cap</text><text x="52" y="542" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start" letter-spacing="0">Negatives</text><rect x="300" y="510" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#D9DFD5" stroke-width="2"/><text x="460.0" y="541" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">one-fact-flipped twins</text><rect x="628" y="510" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#D9DFD5" stroke-width="2"/><text x="788.0" y="541" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">one-fact-flipped twins</text><text x="52" y="604" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start" letter-spacing="0">Targets</text><rect x="300" y="572" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#D9DFD5" stroke-width="2"/><text x="460.0" y="603" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">hard labels + 27B teacher</text><rect x="628" y="572" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#D9DFD5" stroke-width="2"/><text x="788.0" y="603" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">hard labels + teacher</text><text x="52" y="666" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start" letter-spacing="0">Replay</text><rect x="300" y="634" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#D9DFD5" stroke-width="2"/><text x="460.0" y="665" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">6k older items</text><rect x="628" y="634" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#D9DFD5" stroke-width="2"/><text x="788.0" y="665" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">yes</text><text x="52" y="728" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start" letter-spacing="0">Model</text><rect x="300" y="696" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#D9DFD5" stroke-width="2"/><text x="460.0" y="727" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">4B</text><rect x="628" y="696" width="320" height="48" rx="8" fill="#FFFFFF" stroke="#D9DFD5" stroke-width="2"/><text x="788.0" y="727" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="middle" letter-spacing="0">12B</text><text x="52" y="804" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="start" letter-spacing="0">Hard tier</text><rect x="300" y="764" width="320" height="60" rx="8" fill="#B76B48"/><text x="460.0" y="804" fill="#FFFFFF" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle" letter-spacing="0">17 fewer than frozen</text><rect x="628" y="764" width="320" height="60" rx="8" fill="#087F61"/><text x="788.0" y="804" fill="#FFFFFF" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="23" font-weight="700" text-anchor="middle" letter-spacing="0">0.71</text><rect x="52" y="852" width="896" height="100" rx="12" fill="#F1ECE3" stroke="#DFD5C6" stroke-width="2"/><text x="76" y="892" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="600" text-anchor="start" letter-spacing="0">What we learned: it picked up our templates (synthetic multi-hop 0.25 → 1.00)</text><text x="76" y="920" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="19" font-weight="400" text-anchor="start" letter-spacing="0">and grew over-confident (hard-tier calibration error more than tripled).</text><line x1="52" y1="950" x2="948" y2="950" stroke="#D9DFD5" stroke-width="1"/><text x="52" y="989" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start" letter-spacing="0">Not past the frozen model on the hard tier yet.</text><text x="52" y="1023" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Source: PLAN.md W1–W5 (α = 1, 111 public hard items, paired p = 0.008)</text><text x="948" y="1023" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="16" font-weight="400" text-anchor="end" letter-spacing="0">07 / 07</text></svg>