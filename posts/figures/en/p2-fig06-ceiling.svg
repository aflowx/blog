pacing="0">standard</text><text x="555" y="836" fill="#087F61" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="middle" letter-spacing="0">0.89–0.99</text><text x="860" y="800" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="25" font-weight="600" text-anchor="middle" letter-spacing="0">hard</text><text x="860" y="836" fill="#087F61" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="middle" letter-spacing="0">0.60–0.65</text><line x1="716" y1="525.0" x2="844" y2="525.0" stroke="#B76B48" stroke-width="2" stroke-dasharray="6 6"/><circle cx="860" cy="525.0" r="11" fill="#B76B48" stroke="#F6F4ED" stroke-width="3"/><text x="704" y="533.0" fill="#B76B48" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="end" letter-spacing="0">Winnow-12B  0.71 (LoRA)</text><line x1="716" y1="665.3472222222222" x2="844" y2="665.3472222222222" stroke="#8D7F72" stroke-width="2" stroke-dasharray="6 6"/><circle cx="860" cy="665.3472222222222" r="11" fill="#8D7F72" stroke="#F6F4ED" stroke-width="3"/><text x="704" y="673.3472222222222" fill="#8D7F72" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="end" letter-spacing="0">Quire + long-state LoRA  0.495</text><line x1="716" y1="714.3055555555555" x2="844" y2="714.3055555555555" stroke="#8D7F72" stroke-width="2" stroke-dasharray="6 6"/><circle cx="860" cy="714.3055555555555" r="11" fill="#8D7F72" stroke="#F6F4ED" stroke-width="3"/><text x="704" y="722.3055555555555" fill="#8D7F72" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="21" font-weight="600" text-anchor="end" letter-spacing="0">kev 4B (fine-tuned)  0.42</text><rect x="120" y="236" width="828" height="86" rx="10" fill="#EDF2E8"/><text x="146" y="272" fill="#087F61" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="22" font-weight="600" text-anchor="start" letter-spacing="0">In the band: SemIf, reflex and Quire on the public items.</text><text x="146" y="306" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="20" font-weight="400" text-anchor="start" letter-spacing="0">Prompt wording moves you 8 points inside the band, not out of it.</text><line x1="52" y1="920" x2="948" y2="920" stroke="#D9DFD5" stroke-width="1"/><text x="52" y="959" fill="#153E35" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="22" font-weight="500" text-anchor="start" letter-spacing="0">The hard tier stops at 0.60–0.65 for three unrelated teams.</text><text x="52" y="993" fill="#64736C" font-family="-apple-system,&quot;Helvetica Neue&quot;,Helvetica,Arial,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">Source: JevBench v1.3; wording effect measured by reflex; 0.495 from PLAN.md W5 (α = 1)</text><text x="948" y="993" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="16" font-weight="400" text-anchor="end" letter-spacing="0">06 / 07</text></svg>