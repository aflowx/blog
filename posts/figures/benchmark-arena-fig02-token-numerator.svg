<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="860" viewBox="0 0 1000 860" role="img" aria-label="每秒多少 token？先拆开看"><rect width="1000" height="860" fill="#F6F4ED"/><line x1="52.0" y1="65.0" x2="948.0" y2="65.0" stroke="#087F61" stroke-width="2"/><text x="52.0" y="45.0" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="17" font-weight="600" text-anchor="start" letter-spacing="3">INFERENCE  /  FIELD NOTES</text><text x="948.0" y="45.0" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="18" font-weight="500" text-anchor="end" letter-spacing="0">FIG. 02</text><text x="50.0" y="139.0" fill="#153E35" font-family="&quot;Songti SC&quot;,&quot;Noto Serif CJK SC&quot;,serif" font-size="44" font-weight="700" text-anchor="start" letter-spacing="0">每秒多少 token？先拆开看</text><text x="52.0" y="187.0" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="23" font-weight="400" text-anchor="start" letter-spacing="0">两份“每秒多少 token”的成绩单，输出都只占一小截。</text><defs><pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#FFFFFF" stroke-width="3" opacity=".55"/></pattern></defs><text x="52.0" y="256.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="21" font-weight="700" text-anchor="start" letter-spacing="0">InferenceX 公开的一份 AIPerf 成绩单</text><text x="52.0" y="284.0" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">DeepSeek-V4-Pro · 8×B200 · vLLM · 回放 Agent 会话记录 · 32 个会话 · 1 小时</text><rect x="52.0" y="300.0" width="890.2" height="64.0" rx="0" fill="#BAC7BD"/><rect x="942.2" y="300.0" width="5.8" height="64.0" rx="0" fill="#087F61"/><text x="70.0" y="341.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0">输入 99.3%</text><text x="948.0" y="408.0" fill="#087F61" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="18" font-weight="700" text-anchor="end" letter-spacing="0">输出 0.7%</text><path d="M52 369 L52 378 L921.2 378 L921.2 369" fill="none" stroke="#B76B48" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="70.0" y="408.0" fill="#B76B48" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="17" font-weight="600" text-anchor="start" letter-spacing="0">假设缓存无限大，其中 97.65% 的输入可以直接复用前面算过的结果</text><text x="70.0" y="434.0" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="16" font-weight="400" text-anchor="start" letter-spacing="0">（实际命中多少，这次服务端没有上报）</text><text x="52.0" y="486.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="600" text-anchor="start" letter-spacing="0">输入吞吐 138,058 token/秒</text><text x="452.0" y="486.0" fill="#087F61" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0">输出吞吐 906 token/秒</text><text x="52.0" y="556.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="21" font-weight="700" text-anchor="start" letter-spacing="0">OCI + WEKA 公布的“每秒约 200 万 token”</text><text x="52.0" y="584.0" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">每个用户每轮：输入 100,000 token + 输出 100 token；测试设成尽量命中缓存</text><rect x="52.0" y="600.0" width="895.1" height="64.0" rx="0" fill="#BAC7BD"/><rect x="52.0" y="600" width="895.1" height="64" fill="url(#hatch)"/><rect x="947.1" y="600.0" width="4.0" height="64.0" rx="0" fill="#087F61"/><text x="70.0" y="641.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="19" font-weight="700" text-anchor="start" letter-spacing="0">输入 99.9%（其中多少来自缓存，原文没说）</text><text x="948.0" y="696.0" fill="#087F61" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="17" font-weight="700" text-anchor="end" letter-spacing="0">输出 0.1%：按比例推算约每秒 2,000 token，每张 H100 约 28 个</text><line x1="52.0" y1="760.0" x2="948.0" y2="760.0" stroke="#D9DFD5" stroke-width="1"/><text x="52.0" y="799.0" fill="#153E35" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="22" font-weight="500" text-anchor="start" letter-spacing="0">同样叫“吞吐”，里面可能绝大部分是输入。</text><text x="52.0" y="833.0" fill="#64736C" font-family="&quot;PingFang SC&quot;,&quot;Noto Sans CJK SC&quot;,sans-serif" font-size="17" font-weight="400" text-anchor="start" letter-spacing="0">来源：InferenceX 公开运行记录（2026-09-19）；Oracle / WEKA 博客（2026-05-13）</text><text x="948.0" y="833.0" fill="#64736C" font-family="&quot;SFMono-Regular&quot;,Menlo,monospace" font-size="16" font-weight="400" text-anchor="end" letter-spacing="0">02 / 09</text></svg>